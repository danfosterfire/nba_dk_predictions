data:
  raw_dir: data/raw
  processed_dir: data/processed
  features_dir: data/features
  seasons:
    - "1996-97"
    - "1997-98"
    - "1998-99"
    - "1999-00"
    - "2000-01"
    - "2001-02"
    - "2002-03"
    - "2003-04"
    - "2004-05"
    - "2005-06"
    - "2006-07"
    - "2007-08"
    - "2008-09"
    - "2009-10"
    - "2010-11"
    - "2011-12"
    - "2012-13"
    - "2013-14"
    - "2014-15"
    - "2015-16"
    - "2016-17"
    - "2017-18"
    - "2018-19"
    - "2019-20"
    - "2020-21"
    - "2021-22"
    - "2022-23"
    - "2023-24"
    - "2024-25"
    - "2025-26"
  # Minimum games played to include a player
  min_games: 20

  injury_reports:
    dir: data/raw/injury_reports
    # The league-mandated 5:00 PM ET deadline report. Reports are published every 30
    # minutes; the full grid is ~8,000 requests a season against ~170 for this one, and
    # a single daily snapshot is all the preseason feature needs.
    time_key: "05_00PM"
    # Retention is ~7 months and rolling — a date that ages out returns 403 forever and
    # cannot be recovered. This is how far back a sweep reaches; anything older is gone.
    retention_days: 210
    # Deliberately slower than the nba_api delay: this CDN throttles.
    delay: 3.0

  injuries:
    dir: data/raw/injuries
    # A daily cadence. The ESPN feed is current-status only, so it builds history going
    # forward and can never acquire any retroactively — one snapshot a day is the whole
    # archive, and re-running inside the window is a no-op rather than a duplicate.
    min_hours_between_snapshots: 20

  adp:
    draftkings:
      # Manually downloaded from the DK draft lobby — login-gated, zero Wayback presence,
      # live only while contests are open. NOT scrapable and NOT backfillable; a board
      # that is not captured while the lobby is open is gone. See docs/adp-plan.md.
      dir: data/raw/dk_draft_rankings
      # A board captured in this month or later is drafting for the season starting that
      # year. Verified on both anchors: Jul 2026 -> 2026-27, Oct 2025 -> 2025-26.
      season_month_cutoff: 6
    fantasypros:
      dir: data/raw/adp/fantasypros
      # robots.txt permits /nba/adp/ at Crawl-delay 5; /api/, /json/ and /nba/ranker/ are
      # disallowed, so the rendered table is parsed rather than the JSON behind it.
      crawl_delay: 5.0
      # The Wayback host 503s well before the crawl delay, so it gets a longer one.
      wayback_delay: 6.0
      # At or above this share of identical AVG values the board has not moved since the
      # previous snapshot, and inherits its season. Measured: frozen pairs score exactly
      # 1.0000 against a non-frozen maximum of 0.3360, so 0.5 sits in a wide empty gap.
      # This does NOT detect a season flip — flips (0.0055-0.0871) and within-window
      # drift (0.0667-0.2273) overlap and are not separable by identity.
      frozen_threshold: 0.5
      # Below this overlap two boards cannot be compared; treated as "not frozen".
      min_overlap: 40

  boxscore_status:
    # InactivePlayers returns 0 rows before 2006-07 — probed directly, not assumed. This
    # is a third coverage boundary alongside Tier A (30 seasons) and Tier B (13).
    first_season: "2006-07"
    # BoxScoreTraditionalV2 returns 0 rows from this season on; V3 works and carries the
    # same field as lower-case `comment`.
    v3_from_season: "2025-26"
    delay: 0.6
    # Games between manifest/CSV flushes. The full backfill is ~24,600 games and 8-14 h,
    # so it has to survive being killed; smaller is safer, larger is faster.
    flush_every: 25

features:
  # Number of recent games to use as the input sequence
  sequence_length: 10
  # Rolling window sizes for aggregate features
  rolling_windows: [5, 10, 15]
  target_stats:
    - dk_pts

  team_context:
    # A player is on team T's season-start roster if his first appearance for T
    # falls inside T's first N games. 10 recovers a ~15-man roster covering ~96%
    # of realized team minutes; 0 (opening night only) finds 11 players and 84%,
    # dropping anyone injured in October.
    roster_window_games: 10

  preseason:
    # How many of a team's FINAL preseason games count as "late". Early preseason games
    # are experiments; the last one or two approximate the rotation the season opens with,
    # and are the only part of a preseason rotation that forecasts anything. Two rather
    # than one because a single game is one rest decision away from uninformative.
    late_games: 2

  opponent:
    # Deliberately small. Effective support is 892 team-seasons and the matchup
    # interaction is worth ~1% of within-player residual variance, so rank 2 over
    # 8 style x 5 defense dims (26 parameters) is already at the budget.
    rank: 2
    style_dims: 8
    defense_dims: 5

  availability:
    # A spell of this many missed games is a "major" absence. 36.6% of all missed
    # games sit in spells at least this long against 47.6% of spells being a single
    # game — season-ending injury and a rest day are different processes and want
    # different models.
    long_spell_games: 10
    # Team games the season-edge measures are read over: did his season END with him
    # unavailable, and did he START the next one that way.
    season_edge_games: 10
    season_open_games: 20

    # ── src/models/availability.py ──
    # Trailing target seasons held out for the walk-forward evaluation.
    test_seasons: 2
    # Ridge penalty on the (strongly collinear by construction) lag block.
    ridge: 100.0
    # L2 on the beta-binomial GLM's coefficients. Small against a log-likelihood summed
    # over ~10,000 rows — insurance against a flat direction, not real shrinkage.
    glm_l2: 1.0
    # Pseudo-observations pulling each age's mean toward the league mean in the
    # league/age baseline. The README's "shrink hard" instruction, made a number.
    age_shrinkage: 50.0
    # Refits of the GBM against a permuted target, for its chance level.
    n_shuffles: 5
    seed: 42

    # ── src/models/availability_absence.py ──
    absence:
      # Which rounds `make availability-absence` runs. §12's `crossed` is the block x
      # compound 2x2 with its lambda profile; §14's `mixture` crosses the same block against
      # the head that actually ships. The two write DISJOINT artifacts, so `rounds:
      # [mixture]` re-runs §14 alone and cannot overwrite §12's five files — which matters
      # because `make docs-audit` re-derives ~60 quoted figures from them.
      rounds: [crossed, mixture]

model:
  type: lstm          # lstm | transformer | baseline
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  input_size: 15      # len(SeasonBoundaryDataset.FEATURE_COLS) — set automatically at runtime

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 1.0e-5
  early_stopping_patience: 10
  val_split: 0.15
  test_split: 0.10
  seed: 42
  checkpoint_dir: outputs/checkpoints

evaluation:
  predictions_dir: outputs/predictions

# ── Stan heads (src/stan/*.stan, src/models/stan_*.py) ────────────────────────
# The generative chain is availability -> min | available -> counts | min -> makes |
# attempts. With distinct parameter blocks and independent priors the joint posterior
# factorizes EXACTLY, so the heads are fitted separately and recover the identical
# posterior a joint model would. Correlation for the simulator comes from a shared `min`
# draw plus a residual copula, not from joint fitting. See CLAUDE.md.
stan:
  chains: 4
  warmup: 1000
  samples: 1000
  seed: 42
  # Posterior draws pushed through the predictive. Each costs one (rows x games+1)
  # beta-binomial evaluation, so this trades wall clock against Monte Carlo error in the
  # predictive distribution rather than against posterior accuracy.
  predictive_draws: 400
  # Shorter chains for the variant-selection sweeps, which fit the same model many times
  # on a validation split. Selection needs the ordering of a handful of variants, not
  # three-decimal posterior means; the selected variant is then refitted at full length.
  select_warmup: 500
  select_samples: 500

  availability:
    # First season kept in the head's FITTING rows — the games-played head only.
    # `make availability-window` laddered window x season term x dispersion and this arm
    # won on CRPS, PIT and boundary coverage at once: validation CRPS 9.8247 against the
    # full window's 10.0057, a paired gap of -0.181 [-0.257, -0.103]. Deliberately not
    # 2017-18, where the sup-F break scan points: the break's LOCATION and the best
    # fitting WINDOW are different questions, and five target seasons is too few rows.
    # `null` restores the full 1996-97 window exactly. docs/availability-window-plan.md §4.
    #
    # ⚠️ This cuts the rows `stan_availability.StanAvailability.fit` fits on, and nothing
    # else. It must never be pushed up into `availability_design`, which the minutes,
    # composition and games-played heads, the model cards and the simulator all import —
    # they would be silently re-scoped and nothing would raise.
    first_season: 2012-13
    # One beta-binomial dispersion per prior-season MPG role bucket
    # (`src/eda/season_effects.ROLE_EDGES`) rather than one for every player. Fringe
    # players are genuinely more variable than stars — 0.3084 against 0.2456 at the point
    # MLE — and grading it never hurt a metric in the ladder. `false` is the shared scalar,
    # which is `n_rho = 1` in `src/stan/betabinomial_glm.stan` and nests exactly.
    role_rho: true
    # The low-availability MIXTURE — a second component for the disrupted season, with
    # covariates on its weight. `make availability-window` laddered five likelihoods and
    # this one halved the selector: boundary_tail_error 0.0109 against 0.0201, shoulder
    # error -0.0021 [-0.0086, -0.0010], and a TIE on CRPS (+0.011, interval spanning
    # zero). It ships because this head is selected on tail calibration with a CRPS
    # non-inferiority guard — a rule stated as D1 in docs/availability-window-plan.md §8
    # BEFORE the arm was measured, not inferred from the arm that won.
    #
    # `false` recovers the single-component head EXACTLY: `P = 0` in
    # `src/stan/betabinomial_glm.stan`, whose mixture parameters are then zero-length.
    # Asserted on Stan's own `log_prob`, the same discipline `n_rho = 1` carries.
    #
    # Wired all the way through on 2026-08-12 (docs/availability-window-plan.md §7i):
    # `DesignRecipe` carries a SECOND design block for pi's covariates and its own scaler,
    # so `make posteriors`, `rehydrate_availability`, `make model-cards` and the simulator
    # all read the mixture rather than raising or, worse, silently reading the
    # single-component head. `make stan-availability-mixture` remains the port check and
    # needs none of that.
    mixture: true
    # ── The preseason block, adopted 2026-08-13 (docs/preseason-plan.md P2) ──
    # P1's full TEN columns on `beta` — see `stan_availability.PRESEASON_COLS`: preseason
    # minutes volume, three participation levels, two difference-coded deltas, and the
    # missing-preseason indicator split on the age cells P1's census decided. Zero across
    # the block recovers the head that shipped before this date exactly, so `false` is a
    # real rollback rather than a different model.
    #
    # ⚠️ It is the arm the FITTING HALF selected, not the five-column arm declared before
    # the run: on the rolling harness it beats that primary at CRPS -0.0977
    # [-0.1569, -0.0408] and boundary -0.0014 [-0.0019, -0.0010], 8 of 10 origins, which
    # REVERSES P1 decision 4. Two of its columns are read over the preseason's TAIL, so a
    # complete preseason is a production precondition and the runbook's Oct 17-20 window is
    # load-bearing.
    #
    # Adopted against a gate that FAILED as written, deliberately and on the record. P2's
    # bar was a conjunction — a validation CRPS interval clear of zero with the boundary
    # held, AND the rolling harness agreeing — and validation could not resolve the arm
    # (-0.102 [-0.322, +0.121] on the draftable population) while the rolling harness
    # passed both halves at 10 of 10 origins (-0.254 [-0.344, -0.162]). The readings do
    # not conflict: validation's interval contains the rolling estimate and is 2.4x wider
    # on 4.6x fewer rows. The bar was written against the opposite failure and had no
    # clause for this one.
    #
    # ⚠️ Reaches the head through `stan_availability.head_design` and NEVER through
    # `availability_design`, which the minutes, composition, games-played,
    # exchangeability, no-prior and season-term consumers all import. A column that is
    # structurally zero before 2004-05 must not enter any of them by accident.
    preseason: true
    # Normal scale on pi's coefficients. Weakly informative on standardized columns —
    # the point MLE leaves them unpenalized inside a +/-5 box, which has no Bayesian
    # analogue, so this is the one number in the port that is a choice rather than the
    # `1/sqrt(2*l2)` identity.
    pi_gamma_scale: 2.5
    # A "disrupted season" is one where the player misses more than half the schedule.
    # The bound is what stops the two components from label-switching — structural rather
    # than hopeful, and the point MLE fitted mu_low = 0.0999, well clear of it.
    mu_low_max: 0.5

  minutes:
    # ── The preseason block, adopted 2026-08-13 (docs/preseason-plan.md P3) ──
    # Five columns appended to every variant: the SEASON-CENTRED preseason minutes delta
    # plus the missing-preseason indicator split on P1's age cells. This head's gate
    # cleared BOTH halves outright — validation CRPS -4.789 [-8.08, -1.59] minutes and the
    # rolling harness -7.940 [-9.41, -6.44] at 12 of 13 origins, the first block in the
    # project whose rolling reading is the LARGER one. Centred rather than raw because
    # preseason minutes are compressed by an amount that varies with the calendar and this
    # head has no year term to absorb it; centring wins on both readings and takes the
    # season-total bias from -36.68 to -10.95, better than the incumbent's own -19.24.
    #
    # ⚠️ Turning this on also cuts the FITTING rows to 2004-05 onward, because the panel
    # begins there and this head fits from 1997-98 — otherwise the missing indicator is an
    # era dummy on 25.9% of them. That cut is worth 1.19 CRPS minutes on its own, priced
    # separately by P3 so it cannot be credited to the block. `false` restores the
    # pre-2026-08-13 head — full window, no block — exactly.
    #
    # ⚠️ Reaches the head through `stan_minutes.head_design` and NEVER through
    # `build_design`, which stan_composition, minutes_window, minutes_unification and
    # minutes_preseason all import.
    preseason: true
    # Prior-season total minutes required before a row is fitted. Matches the component
    # heads' qualification threshold, where reliability is already ~0.75.
    min_prior_minutes: 200
    # Games played in the target season required before its minutes total is a usable
    # observation of a rate.
    min_games: 10
    spline_knots: 5

  components:
    # Every head gets a spline variant and the winner is picked on a VALIDATION split,
    # rather than hard-coding "splines on fg3a and blk only". `make component-rates`
    # measured that pattern (+0.030 R^2 on fg3a, +0.041 on blk, <= +0.003 elsewhere) under
    # a different likelihood, so re-deriving it is the check; baking it in as config would
    # make the sweep unable to disagree.
    spline_knots: 5

  # The season-term ablation — `make season-terms`, src/models/season_terms.py.
  season_terms:
    # Posterior draws pushed through the eleven-head season-total composition. A memory
    # knob: eleven heads x draws x test rows of predictive samples.
    composition_draws: 400

    # ⏰ THE MANUAL LEAGUE-LEVEL OVERRIDE — the one season effect that IS knowable in
    # advance, and the reason this is config rather than code.
    #
    # Rule changes and points of emphasis are announced in the summer, before opening
    # night: the 2004-05 hand-checking crackdown (+7.6% league FTA) and the 2021-22
    # non-basketball-moves emphasis were both public ahead of the season. A multiplier set
    # here by a human who read the announcement is therefore legitimate point-in-time
    # information, unlike anything drawn from inside the season — and unlike a fitted
    # trend, which `make season-effects` shows is only extrapolable for `fg3a`.
    #
    # `{component: {season: multiplier}}`, applied to the predicted season total. Empty is
    # today's behaviour exactly. `make season-terms` prints the ORACLE version of this
    # beside it — a perfect per-season multiplier — which is the ceiling on what filling
    # this in could ever be worth, so a real entry can be judged against a known bound.
    league_override: {}

  # The games-played spell process — docs/games-played-plan.md.
  games_played:
    # Single-team player-seasons only. 12.2% of player-seasons are multi-team but carry
    # 36.7% of full-window missed games, because a traded player is "rostered all year"
    # for BOTH teams — simulating per cell and summing double-counts his absences.
    # Prediction is unaffected: every covariate is player-season level, so the excluded
    # rows are still scored and CRPS stays comparable to the incumbent's 10.795.
    single_team_only: true
    # Ignoring censoring understates P(T >= 26) by 2.16x and treating censored spells as
    # complete still understates it by 1.44x. Both fail silently. Within the tenure every
    # spell is interior, so this only bites on the full-window spell-class artifact.
    handle_censoring: true
    # Half-normal scale on the beta-geometric concentration a + b. The closed-form fit on
    # interior spells lands at 3.69, so this is weakly informative by ~an order of
    # magnitude and the data decides.
    kappa_scale: 25.0
    # Posterior draws x simulated seasons per draw pushed through the predictive. There is
    # no closed form for the games-played marginal of a tenure-truncated chain with two
    # frailties, so the pmf is Monte Carlo; 200 x 50 puts its error at ~0.003 on any
    # single cell and far less on CRPS, which integrates over the whole distribution.
    predictive_draws: 200
    sim_seasons: 50
    # Gate 0's Monte Carlo, which is numpy only and runs without a CmdStan toolchain.
    gate0_sims: 200
    # Gate A: abort before the ladder if the timing probe extrapolates past this. The
    # estimate is multiplied by the 1.63x under-prediction `stan-composition` measured on
    # its two-pass sweep, so this is compared against a corrected figure rather than a
    # linear one. That head's one-pass re-run re-measured the miss at 1.17x; 1.63 is kept
    # deliberately, as a conservative factor rather than a current estimate — see
    # `stan_games_played.probe_timing`.
    max_extrapolated_hours: 6.0

  # The game-length head — docs/simulations-plan.md, "The second prerequisite". Whether a
  # game goes to overtime and how deep, so a FORWARD simulation can draw a length instead
  # of looking one up. It sits under `stan:` rather than under `sim:` because it is a
  # fitted model; only its draws are a simulator input.
  game_length:
    # Depth counts 33,433 / 1,821 / 250 / 37 / 5 over 35,546 regular-season games; nothing
    # past 4OT. Continuation is 0.1382 / 0.1438 / 0.1190 by depth, so a geometric in depth
    # covers 2OT-4OT for free and there is no depth dependence to fit.
    arms: [floor, season_trend, season_trend_matchup]
    # Regular season only, matching every other fitting frame and the contest window.
    season_type: regular
    # Half-normal scale on the beta-geometric concentration, mirroring games_played.
    kappa_scale: 25.0
    # Cells for the matchup arm only. A beta-binomial at one game per row is a Bernoulli
    # and its dispersion is unidentified, so the per-game gap is binned; the edges are
    # quantiles of the FITTING half.
    matchup_bins: 10

  # The team-game minutes composition head — docs/minutes-composition-plan.md.
  composition:
    # The frame is built over every season (lags and the expanding rookie prior need
    # the history); fitting starts here. This was "2018-19" for the pilot; Gate E —
    # the full-window refit — was taken on 2026-08-03 after Gates A-D passed, so the
    # head now fits every season the frame covers.
    first_season: "1996-97"
    # Joint draws kept per predictive. Each is a full sequential allocation of every
    # team-game, so this is the wall-clock knob for scoring, not for fitting.
    predictive_samples: 200
    # Whether `make posteriors` fits the composition WITH the per-(player, season) random
    # effect and the team-context block. Both default OFF, so the persisted head is the one
    # `make stan-composition` selected until `make composition-effects` says otherwise —
    # this module persists what shipped rather than re-deciding it. Turning
    # `player_season_effect` on changes what the artifact carries (`sigma_u_draws`, and a
    # predictive that consumes it) and costs a refit of the project's most expensive head
    # under `diag_e`; see docs/simulations-plan.md, "Fitting sigma".
    player_season_effect: false
    team_context: false
    # Gate A: abort before the sweep if the one-season timing probe extrapolates the
    # six-fit sweep past this many hours.
    max_extrapolated_hours: 24

    # ── Item 3d — `make composition-effects`, src/models/composition_effects.py ──
    # The per-(player, season) random effect (`sigma_u` in composition_glm.stan) and the
    # team-context block. Its own target rather than an extension of the sweep above,
    # because `outputs/predictions/stan_composition_metrics.csv` is the incumbent's record
    # and `make docs-audit` re-derives eleven quoted figures from it — a partial run would
    # overwrite them with figures answering a different question.
    effects:
      # The PILOT window, deliberately: 97,587 rows / 2,204 units against the full
      # window's 631,158 / 12,307. Get the arm ordering here, then commit the selected arm
      # to the full window. This head took exactly that path once already.
      first_season: "2018-19"
      # `base` is the shipped specification refitted on THIS window — a same-window
      # control, not a refit of the incumbent, and it exists for the same reason
      # `stan_game_length`'s `season_trend_covered` does: a pilot-window arm ordering is
      # uninterpretable against a full-window baseline.
      #
      # ORDERED BY DECISION VALUE, not by cost, with one exception. `base` runs first
      # because it is cheap and exercises the whole pipeline — scoring, the season-unit
      # comparison, the artifacts — before hours are spent, which is the same
      # "cheapest first, so a plumbing failure surfaces in seconds" rule `make stan`
      # follows. Then `ps`, which alone decides P2 and P3. Each arm checkpoints as it
      # lands, so a run that is cut short still leaves the gates that decide the item.
      #
      # `ps_team` IS DELIBERATELY NOT HERE, and that is a measured decision rather than a
      # budget cut. It exists for Gate P4 — does the team block reduce fitted `sigma_u`? —
      # and `make composition-effects` already answered the question P4 is a proxy for, on
      # 8,570 training player-seasons and without a sampler: the block is worth +1.2 points
      # of R2 on a deviation that is 7.5% predictable in total. A 6.3 h fit cannot resolve
      # that better than the regression did, so the arm buys a null we have already priced.
      # `team` stays because it is ~30 min under `dense_e` and prices the same block at the
      # per-team-game unit, which the deviation regression does not reach. Put `ps_team`
      # back if `ps` passes P2 and the team block is wanted in the shipped arm.
      arms: [base, ps, team]
      warmup: 500
      samples: 500
      # Half-normal scale on sigma_u. Weakly informative by ~2x against the injection's
      # measured 0.375-0.45, so Gate P5 is a replication rather than a foregone conclusion.
      u_sd_scale: 1.0
      # Matches `max_extrapolated_hours` above rather than being tighter: Gate A here
      # probes the `ps` arm — the one carrying the cost risk — and the measured
      # extrapolation for the four-arm pilot is most of a day. That is a real budget for
      # this head (`make stan-composition` itself is 9.92 h), so the gate exists to catch a
      # run that is worse than that, not to refuse the one the plan specifies.
      max_extrapolated_hours: 24

# ── The simulation and drafting layer (src/models/posteriors.py, src/sim/) ────
# `docs/simulations-plan.md` specifies the whole block. Only the keys a built module
# actually reads live here — config nothing reads is config that drifts. The rest
# (n_sims, pod_size, the tournament entry counts, the field model, error injection)
# arrives with the modules that consume it.
sim:
  # Draws kept per head by `make posteriors`, THINNED ACROSS THE WHOLE POSTERIOR via
  # `stan_utils.thin` — never sliced off the front, for the reason
  # `season_terms._draw_components` records: a front slice takes a different part of the
  # posterior from each head, silently.
  posterior_draws: 1000
  # Simulated seasons per target season — `make simulate-season`. Sim `s` uses posterior
  # draw `s % posterior_draws` for EVERY player and every head, so at 2,000 sims over 1,000
  # draws each draw generates two boards. That mapping is the layer's rule 4: players share
  # `beta`, so one draw has to move the whole board together. The tensor is
  # players x 20 x n_sims float32 plus a uint8 twin, ~90 MB at 450 players.
  n_sims: 2000
  # THE DEFAULT IS `train`, and the reason is the realized backtest. It replays simulated
  # portfolios against real 2022-23 / 2023-24 box scores — the validation seasons — and at
  # `train_val` every one of those rows is in the fit (883 of 10,361 availability rows, 773
  # of 9,403 component rows). Artifacts are namespaced by window under
  # data/features/posteriors/<window>/, because all three windows are wanted at once:
  #   train      the validation backtest and the strategy sweep
  #   train_val  the one-shot test readout, which should describe the model that would
  #              actually deploy — the same rule src/final_evaluation.py follows
  #   full       the 2026-27 production board; reads the held-out seasons and is guarded
  #              by src/models/held_out.py
  # This is NOT the rule the four already-calibrated simulator inputs follow (the residual
  # copula, the game-level minutes dispersion, the block variance inflation, the bonus
  # overdispersion). Those are `train_val` because they are *given* to the simulator and
  # never scored against realized data; coefficients generate the board that is.
  fit_window: train

  # ── The minutes draw ──────────────────────────────────────────────────────
  # THE SHIPPED per-(player, season) effect size, injected into the composition's linear
  # predictor at draw time. `make minutes-unification` measured the composition's season
  # totals 4.68x too narrow and traced it to this missing parameter; injecting `sigma * z`
  # per unit per posterior draw and re-running the head's OWN sequential allocation moves
  # the season-total predictive sd from 64.65 to 280.87 and TIES the marginal head
  # (CRPS 142.87 against 144.35, gap -1.49 [-6.14, +3.22]), with better calibration
  # (PIT KS 0.0659 against 0.0735) and the team constraint still exact.
  #
  # **0.450 is estimated on TRAIN**, by running the identical grid over the last two
  # training seasons — so it owes the evaluation split nothing, which was the injection's
  # one load-bearing caveat. Five independent routes agree: 0.375 (validation CRPS grid),
  # ~0.41 (calibration target — the ratio of the head's residual sd to its predictive sd),
  # 0.450 (train CRPS grid), 0.4776 and 0.4809 (fitted in Stan, non-centred and centred).
  #
  # A FITTED `sigma_u` is strictly better in two respects — beta estimated jointly with it,
  # and the predictive integrating over sigma's posterior rather than plugging one in — and
  # `composition_glm.stan` carries the parameter. It is not shipped because it costs ~6 h
  # per arm even at a 4-season window and did not converge in the budget available; see
  # docs/potential-to-dos.md. Set to 0.0 to recover the un-injected head exactly.
  minutes:
    player_season_sigma: 0.450

  # ── The availability layout ───────────────────────────────────────────────
  # WHERE the missed games fall, given how many there are. The availability head cannot
  # say — `gp` is invariant to the arrangement — so this is chosen at draw time, and it is
  # the largest distributional error measured on that head at the unit DK actually seats a
  # lineup in: `make availability-exchangeability` puts an exchangeable layout 9.1x short
  # on a star's chance of three consecutive dead scoring periods.
  #
  # `tenure_merge` is the shipped corner of a measured 2x2. The tenure half lays the
  # pre- and post-tenure edge blocks at the *ends* from `games_played.EdgeResampler`,
  # because 44.17% of the head's missed games are edge blocks whose length and position
  # an interior beta-geometric at a random start gets wrong in both directions. The
  # overflow half stops `allocate_spells` collapsing a heavily-absent row to one giant
  # block when the draw wants more spells than the schedule has gaps — it fires on 41.28%
  # of fringe rows and 2.32% of star rows, so it is a role-shaped artifact.
  #
  # The two are not separable and neither ships alone: `merge` on its own strips out the
  # accident that was doing the clumping (pooled longest-dead-run recovery 1.1162 ->
  # 0.2707) and `tenure` on its own compounds with it (fringe 1.2389 -> 1.5370 on dead
  # periods). Together they land the recovered share near 1.0 in every role bucket and
  # reproduce the realized spell-length distribution they were never scored on.
  #
  #   clustered     the previous shipped layout — pooled beta-geometric spells at random
  #                 starts, collapse on overflow. Recoverable exactly.
  #   merge         overflow only
  #   tenure        edge blocks only
  #   tenure_merge  both — SHIPPED
  availability:
    layout: tenure_merge

    # WHICH RATE a rostered player the availability head has no row for is handed. The head
    # is lag-1, so a rookie or a returning veteran is not in its frame at all — 106 of 539
    # rostered players in 2022-23 — and he reaches the simulator through
    # `sim/season.no_design_availability` instead. That used to be ONE pooled scalar for a
    # population whose realized level spans 3.33x, so an undrafted call-up and a first
    # overall pick were given the same availability.
    #
    # `make availability-no-prior` (§8b of docs/availability-window-plan.md) laddered the
    # pooling KEY, holding the estimator fixed — the realized `gp / team_games` of rows
    # carrying that key over seasons strictly before the target, which is
    # `rookie_share_priors`' construction one column over. `tenure_draft` wins both splits
    # against the incumbent and against every other arm, with intervals clear of zero.
    #
    # The tenure split is the half that is not obvious, and it is the half that keeps the
    # arm honest: a draft bucket is a strong signal for a FIRST appearance (rookies realize
    # 0.2613 undrafted to 0.8294 lottery top-5) and a weak one for a RETURN (0.2200 to
    # 0.3837 over the same buckets, on a player whose draft night was a decade ago). Keying
    # both on the bucket alone averages a gradient with a flat, and hands a returning
    # ex-lottery pick 0.73 where he realizes 0.34.
    #
    #   pooled        one scalar for everybody — the previous behaviour, recoverable exactly
    #   draft         draft bucket alone
    #   tenure        rookie / returning alone
    #   tenure_draft  rookie x draft bucket, returning pooled — SHIPPED
    no_design_level: tenure_draft

  # `make scoring-periods` — the NBA week grid and DK's rounds on top of it.
  scoring_periods:
    # DK's tournament shape in NBA weeks: Round 1 is 17 weeks, then three double
    # weeks. This is the *structure*, not the calendar. The published windows in
    # docs/dk_best_ball_rules.md (Round 1 closing 2/14, the Cup final on 12/11/2026)
    # belong to a single season's rules and slide against any other season's grid —
    # 2025-26's week 17 closes 2/12. The week counts are what carries across seasons,
    # so they drive the map and the calendar comparison is printed as drift.
    round_weeks: [17, 2, 2, 2]

  # Every captured tournament, and how many entries each takes — since 2026-08-11 the
  # sweep drafts and scores all five structures, not only the original reference pair.
  # These are SIMULATED stakes; no contest has been entered and which to enter is an
  # open decision (the likely first real entries are cheap 15k_and_one teams, whose
  # purpose would be pick-log capture rather than profit — see
  # `real-pick-logs-are-the-missing-field-calibration`). The entry counts follow ONE
  # rule: min(max_entries_per_player,
  # ceil($200 / entry_fee)) — near-equal stake, capped by DK's own per-player limit —
  # which reproduces the original hand-chosen 10 and 4 exactly and extends to the rest.
  # Where the rule cannot reach $200 the stake diverges and that is stated rather than
  # hidden: 15k_and_one tops out at $150 (fee $1, cap 150) and 88k_alley_oop's single
  # entry is already $450. The FIRST TWO keys are the reference tiers — the pair the
  # headline results are quoted at — and their order
  # is load-bearing: Gate D compares exactly the first two. The NAMES are keys into
  # data/raw/dk_best_ball_tournament_metadata.csv, and every structural number behind
  # them — round count, pod size, advance count, cash table — is derived by
  # dashboard/economics.py rather than repeated here; nothing in src/sim/ knows a
  # tournament by name. 15k_and_one's 150 entries are the sweep's cost center: the
  # objective arms call draft_room.evaluate once per pick, so this tier alone adds
  # ~35 min to `make strategy-sweep`.
  tournaments:
    600k_shootaround: {entries: 10}
    20k_spin_move: {entries: 4}
    50k_four_pt_play: {entries: 20}
    15k_and_one: {entries: 150}
    88k_alley_oop: {entries: 1}

  # `make bracket`. There is NO field-size knob: each contest is played at its own
  # `total_entries` from data/raw/dk_best_ball_tournament_metadata.csv — 35,280 down to
  # 216 — like every other structural number, and all five are simulated rather than only
  # the reference pair. They cost one scoring pass between them: the field is drafted
  # once per season at the largest size and each contest takes the prefix it needs, which
  # is valid because entries are exchangeable and every field size is a multiple of the
  # 12-entry round-1 pod.
  #
  # The size is load-bearing, not just sample size. The final round is one contest of
  # everyone who reached it, so the field size *is* the last pod (49 and 8 for the two
  # targets), and 600k_shootaround advances 1 in 720 across three cuts: against a
  # 3,000-entry stand-in its round 4 was decided by four surviving entries and the
  # symmetric-field null read ROI +0.72 instead of the exact -0.1497. That is the convexity
  # of a 10,000x top prize against a degenerate pool, not noise — and it is what made an
  # earlier version reach for a parametric progression model, since withdrawn.
  bracket:
    # Simulated seasons. The field's per-period array is entries x 20 x n_sims float32, so
    # this is the memory knob: 0.71 GB at 600k_shootaround's real field size.
    n_sims: 250
    # Exchangeable entries scored alongside, to reproduce the symmetric-field null
    # empirically. Their P(advance) must come back at n_advance / pod_size and their ROI
    # at -rake; both are known exactly, so they check the payout wiring end to end.
    n_null: 250

  # ── The opponent field — `make draft-sim` ─────────────────────────────────
  # In-draft sims for the reactive recommender. The in-draft decision is a RANKING of
  # candidates, not an estimate of a level, so it does not need the sweep's 2,000.
  n_sims_draft: 500
  pod_size: 12

  # ── The live draft room — `make draft-room` ───────────────────────────────
  draft_room:
    # Twelve-seat pods of the fitted field, drafted and scored ONCE per season and cached
    # to data/features/draft_room_field_<season>.npz. This is the population `q` — the
    # probability a pod-mate outscores us — is read from, so it decides the resolution of
    # every EV the room prints. 100 pods (1,200 entries) reproduce `20k_spin_move`'s
    # symmetric-field null to -0.03% and cost ~13 s to build; `600k_shootaround` reads
    # -17% because two thirds of its EV sits in a 49-seat final table that 0.139% of
    # entries reach, and that does not converge at any affordable size — 300 pods buys
    # -7.7% for 43 s and does NOT make the ranking more stable. See
    # `draft_room_stability.csv`.
    field_drafts: 100
    # Which of the three registered objectives the table is ordered by. `bracket_ev` is
    # the decision-5 objective and the default; `p_advance` is P(top 2 of 12), the one
    # figure here that reproduces its analytic value exactly and the statistic
    # docs/simulations-plan.md says the strategy sweep selects on.
    objective: bracket_ev
    # Our seat in the twelve-entry pod, zero-indexed. DK randomizes it once the lobby
    # fills, so this is set in the page rather than trusted from here.
    seat: 0

  # ── The strategy sweep — `make strategy-sweep` ────────────────────────────
  strategy:
    # Simulated worlds each strategy is scored on. Our entries and the field share them,
    # so every comparison is PAIRED and resolves far faster than the count suggests.
    n_sims: 500
    # Twelve-seat pods in the reference field, drafted once per season on the injected
    # world and reused across the whole table. The same caveat draft_room records: the
    # advance rate is exact at this size and 600k_shootaround's EV level is not.
    field_drafts: 100
    # GATE C. Disabling the injection changes the question being asked, so there is no
    # switch here — what the injection does is CALIBRATED rather than chosen, from two
    # measurements taken on realized validation seasons:
    #   * the season-total MAE bar (400.46, season_total_metrics.csv) fixes the scale;
    #   * the MARKET SKILL GAP — spearman(ADP, realized) minus spearman(model, realized) —
    #     fixes how much of the error the market can see.
    # The second is the one the plan did not name and it is the one that matters. The
    # uninjected world already reproduces the model's measured miss in MAGNITUDE (419.6
    # against 400.5 on 2022-23); what it gets backwards is the two rankers' relative
    # standing, leading by +0.11 Spearman where reality has the market ahead by +0.06.
    # A blend weight priced in that world is priced against a market that is a strictly
    # noisier copy of the model, which is exactly what Gate C exists to prevent.
    error_injection:
      targets: [season_total_mae, market_skill_gap]

  field:
    # docs/adp-plan.md binds this: never the raw consensus. A Yahoo/ESPN consensus
    # correlates with the one real DK board at rho 0.870 but with a 21.9-pick mean absolute
    # rank gap, and DK drafts centers 11.9 picks earlier because category-league ADP
    # discounts them for FT% while DK Best Ball pays rebounds 1.25 and blocks 2.0 flat.
    # Uncorrected, that scoring-system artifact would read as model edge on exactly one
    # position. `draft_pool.adp_dk_scale` is the recalibrated column.
    adp_source: dk_recalibrated
    # BOTH ARE FITTED BY GATE B, not chosen — null means "read the selected row from
    # outputs/predictions/draft_gate_b.csv", the same rule src/final_evaluation.py follows
    # for which arm shipped. A literal number here would be a second source of truth.
    #
    # What the fit found, and it is the reason the plan said fit rather than choose: a
    # CONSTANT rank noise is not identified by a mean-ADP target at all. E[pick] is the
    # board rank for any interior player under symmetric noise of any size, so the whole
    # grid is flat to a few hundredths of a pick. A rank-DEPENDENT shape is identified,
    # because it is pinned at both ends at once — the top of the board, where the observed
    # curve is nearly deterministic (the consensus #1 goes at 1.05), and the deep rounds,
    # where it compresses.
    noise_model: null
    rank_noise_sd: null
    # DK's own autodraft defaults, from docs/dk_best_ball_rules.md. They are MAXIMA and
    # imply no minimum: 8G + 8F + 0C satisfies all three and seats no centre.
    position_caps: {G: 8, F: 8, C: 3}
    # Which is why this is separate. It restricts a seat whose remaining picks equal the
    # slots it still owes, so every drafted roster stays scorable by bracket.best_lineup —
    # which would otherwise return a plausible six-man total. Not a DK rule; a guard.
    require_legal_lineup: true
    # `adp_need`'s lean toward positions still owed, in picks of board rank. 0 = off.
    need_weight: 0.0
    # Drafts per Gate B grid point. 192 picks x this x the pool, vectorized over drafts.
    n_drafts: 400
    # UNCALIBRATED, and deliberately an interface rather than a measurement.
    # docs/simulations-plan.md names field quality by tier as a live risk in a specific
    # direction: a $20 field plausibly holds far more autodraft entries than a $52 one,
    # which is the OPPOSITE of what the rake maths would suggest. One hard-coded field
    # would bake that in where nobody could see it. Shares per tournament, resolved
    # through `default`; registered strategies are `adp`, `adp_need`, `ranking_submission`.
    composition:
      default: {adp: 1.0}

eda:
  # Qualification filter for the season matrix. MIN is per-game, so this reads
  # "at least 20 games at 10+ minutes a night" — below that, per-36 rates from a
  # handful of garbage-time minutes are wild outliers.
  min_gp: 20
  min_minutes: 10
  # The unfiltered twin, written alongside each matrix for roster aggregation.
  # Sub-threshold players are real teammates consuming real minutes; excluding them
  # biases team aggregates toward veterans. Consumers down-weight instead.
  roster_frame:
    min_gp: 1
    min_minutes: 0
  # Analysis reports land here; the parquet/pickle artifacts that later modeling
  # consumes go to data.features_dir alongside the season matrices.
  output_dir: outputs/eda

  pca:
    variance_target: 0.90
    modes: [within_season, pooled]

  archetypes:
    # Cluster over the leading era-adjusted PCs, not the raw features.
    n_pcs: 10
    k_min: 4
    k_max: 14
    # null → pick the k with the best silhouette from the sweep
    k: null

  preseason_value:
    # Permutations of the preseason block within season, for the ΔR² noise floor. A small
    # ΔR² is unreadable without one — this is what a block of that shape earns by chance.
    # The whole gate runs in seconds, so this is set for a stable sd rather than for cost.
    n_shuffles: 20
    seed: 42

  persistence:
    # Lag-k persistence, for the staleness decay team_context currently flat-rates
    # at 0.96/season.
    max_lag: 4
    # A column measured on fewer pairs than this is not ranked at all.
    min_pairs: 200
    # Prior-season total-minute bins the reliability curve r(m) is fitted across.
    # Dense at the bottom because that is where the curve actually bends — above
    # ~2,000 minutes every stat has flattened out.
    reliability_bins: [0, 100, 250, 500, 1000, 1500, 2000, 2500, 4000]

  aging:
    # Ages outside this range are a handful of players a season and produce curves
    # made of noise.
    age_min: 19
    age_max: 40
    # Distinct players required before an age point is reported.
    min_players_per_age: 25
    # Age the cumulative curve is anchored at (0 by construction).
    anchor_age: 23

  target:
    # Minutes played in the game — the exposure every rate is measured over.
    minutes_buckets: [0, 5, 12, 18, 24, 30, 48]
    # Prior-season usage rate, joined from the season matrix.
    usage_buckets: [0.0, 0.15, 0.20, 0.25, 0.30, 1.0]
    # "How well do the first k games predict the final season total?"
    first_k_games: [5, 10, 20, 41, 60]

  feature_diagnostics:
    # |r| above which two features are put in the same collinearity cluster.
    collinearity_threshold: 0.95
    # Conventional VIF alarm level; reported, not enforced.
    vif_flag: 10.0

  availability:
    # "Established rotation player" — last season's regulars. The overdispersion
    # figure is quoted on this population because it is the one a naive model would
    # call reliably available, which is what makes the spread worth reporting.
    rotation_min_mpg: 20.0
    rotation_min_gp_share: 0.70
    # Width of the games-played histogram bins in the profile output.
    gp_histogram_bin_width: 8
    # A category with fewer rows than this is a cold-start risk for target encoding.
    min_category_n: 50
    # 5 is not enough for the cell-mean null: its per-draw sd is ~0.024pp and the
    # distribution is skewed, so 5 draws land on +0.922% where 20 and 50 both give
    # +0.962%. Whatever number is used, `null_sd` is reported alongside it.
    n_shuffles: 20
    # The window the quoted +0.97% opponent figure was measured on. The shuffled-null
    # helper must reproduce it here, or the generalization disagrees with the one-off
    # it was built from.
    null_window: ["2014-15", "2023-24"]
    # Share of a player-season's games that must carry a real box-score status before the
    # reason decomposition is measured on it. Both sides of a season pair must clear it,
    # otherwise the split measures how far `make boxscore-status` has run.
    min_status_coverage: 0.9
    # Below this many usable pairs the decomposition reports "insufficient coverage"
    # rather than a number — no measurement, which is not the same as no effect.
    min_decomposition_pairs: 200
    sequence:
      # Trailing seasons held out for the sequence-vs-aggregate ablation.
      test_seasons: 2
      # Length of the "recent form" tail feature.
      recent_games: 10

  report_calibration:
    # Minimum rows in a (designation x stated reason) cell before its P(play) is
    # reported. Below this the estimate is mostly the denominator: the reason
    # vocabulary has a long tail ("Trade Pending", "Concussion Protocol") where a
    # handful of rows would otherwise print as a confident 0.000 or 1.000.
    min_reason_cell: 30
