data:
  raw_dir: data/raw
  processed_dir: data/processed
  features_dir: data/features
  seasons:
    - "1996-97"
    - "1997-98"
    - "1998-99"
    - "1999-00"
    - "2000-01"
    - "2001-02"
    - "2002-03"
    - "2003-04"
    - "2004-05"
    - "2005-06"
    - "2006-07"
    - "2007-08"
    - "2008-09"
    - "2009-10"
    - "2010-11"
    - "2011-12"
    - "2012-13"
    - "2013-14"
    - "2014-15"
    - "2015-16"
    - "2016-17"
    - "2017-18"
    - "2018-19"
    - "2019-20"
    - "2020-21"
    - "2021-22"
    - "2022-23"
    - "2023-24"
    - "2024-25"
    - "2025-26"
  # Minimum games played to include a player
  min_games: 20

features:
  # Number of recent games to use as the input sequence
  sequence_length: 10
  # Rolling window sizes for aggregate features
  rolling_windows: [5, 10, 15]
  target_stats:
    - dk_pts

  team_context:
    # A player is on team T's season-start roster if his first appearance for T
    # falls inside T's first N games. 10 recovers a ~15-man roster covering ~96%
    # of realized team minutes; 0 (opening night only) finds 11 players and 84%,
    # dropping anyone injured in October.
    roster_window_games: 10

  opponent:
    # Deliberately small. Effective support is 892 team-seasons and the matchup
    # interaction is worth ~1% of within-player residual variance, so rank 2 over
    # 8 style x 5 defense dims (26 parameters) is already at the budget.
    rank: 2
    style_dims: 8
    defense_dims: 5
    ridge: 100.0

model:
  type: lstm          # lstm | transformer | baseline
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  input_size: 15      # len(SeasonBoundaryDataset.FEATURE_COLS) — set automatically at runtime

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 1.0e-5
  early_stopping_patience: 10
  val_split: 0.15
  test_split: 0.10
  seed: 42
  checkpoint_dir: outputs/checkpoints

evaluation:
  predictions_dir: outputs/predictions

eda:
  # Qualification filter for the season matrix. MIN is per-game, so this reads
  # "at least 20 games at 10+ minutes a night" — below that, per-36 rates from a
  # handful of garbage-time minutes are wild outliers.
  min_gp: 20
  min_minutes: 10
  # The unfiltered twin, written alongside each matrix for roster aggregation.
  # Sub-threshold players are real teammates consuming real minutes; excluding them
  # biases team aggregates toward veterans. Consumers down-weight instead.
  roster_frame:
    min_gp: 1
    min_minutes: 0
  # Analysis reports land here; the parquet/pickle artifacts that later modeling
  # consumes go to data.features_dir alongside the season matrices.
  output_dir: outputs/eda

  pca:
    variance_target: 0.90
    modes: [within_season, pooled]

  archetypes:
    # Cluster over the leading era-adjusted PCs, not the raw features.
    n_pcs: 10
    k_min: 4
    k_max: 14
    # null → pick the k with the best silhouette from the sweep
    k: null

  persistence:
    # Lag-k persistence, for the staleness decay team_context currently flat-rates
    # at 0.96/season.
    max_lag: 4
    # A column measured on fewer pairs than this is not ranked at all.
    min_pairs: 200
    # Prior-season total-minute bins the reliability curve r(m) is fitted across.
    # Dense at the bottom because that is where the curve actually bends — above
    # ~2,000 minutes every stat has flattened out.
    reliability_bins: [0, 100, 250, 500, 1000, 1500, 2000, 2500, 4000]

  aging:
    # Ages outside this range are a handful of players a season and produce curves
    # made of noise.
    age_min: 19
    age_max: 40
    # Distinct players required before an age point is reported.
    min_players_per_age: 25
    # Age the cumulative curve is anchored at (0 by construction).
    anchor_age: 23

  target:
    # Minutes played in the game — the exposure every rate is measured over.
    minutes_buckets: [0, 5, 12, 18, 24, 30, 48]
    # Prior-season usage rate, joined from the season matrix.
    usage_buckets: [0.0, 0.15, 0.20, 0.25, 0.30, 1.0]
    # "How well do the first k games predict the final season total?"
    first_k_games: [5, 10, 20, 41, 60]

  feature_diagnostics:
    # |r| above which two features are put in the same collinearity cluster.
    collinearity_threshold: 0.95
    # Conventional VIF alarm level; reported, not enforced.
    vif_flag: 10.0
    # A category with fewer rows than this is a cold-start risk for target encoding.
    min_category_n: 50
    # 5 is not enough for the cell-mean null: its per-draw sd is ~0.024pp and the
    # distribution is skewed, so 5 draws land on +0.922% where 20 and 50 both give
    # +0.962%. Whatever number is used, `null_sd` is reported alongside it.
    n_shuffles: 20
    # The window the quoted +0.97% opponent figure was measured on. The shuffled-null
    # helper must reproduce it here, or the generalization disagrees with the one-off
    # it was built from.
    null_window: ["2014-15", "2023-24"]
    sequence:
      # Trailing seasons held out for the sequence-vs-aggregate ablation.
      test_seasons: 2
      # Length of the "recent form" tail feature.
      recent_games: 10
