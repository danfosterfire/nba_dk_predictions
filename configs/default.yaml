data:
  raw_dir: data/raw
  processed_dir: data/processed
  features_dir: data/features
  seasons:
    - "1996-97"
    - "1997-98"
    - "1998-99"
    - "1999-00"
    - "2000-01"
    - "2001-02"
    - "2002-03"
    - "2003-04"
    - "2004-05"
    - "2005-06"
    - "2006-07"
    - "2007-08"
    - "2008-09"
    - "2009-10"
    - "2010-11"
    - "2011-12"
    - "2012-13"
    - "2013-14"
    - "2014-15"
    - "2015-16"
    - "2016-17"
    - "2017-18"
    - "2018-19"
    - "2019-20"
    - "2020-21"
    - "2021-22"
    - "2022-23"
    - "2023-24"
    - "2024-25"
    - "2025-26"
  # Minimum games played to include a player
  min_games: 20

features:
  # Number of recent games to use as the input sequence
  sequence_length: 10
  # Rolling window sizes for aggregate features
  rolling_windows: [5, 10, 15]
  target_stats:
    - dk_pts

model:
  type: lstm          # lstm | transformer | baseline
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  input_size: 15      # len(SeasonBoundaryDataset.FEATURE_COLS) — set automatically at runtime

training:
  epochs: 100
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 1.0e-5
  early_stopping_patience: 10
  val_split: 0.15
  test_split: 0.10
  seed: 42
  checkpoint_dir: outputs/checkpoints

evaluation:
  predictions_dir: outputs/predictions
